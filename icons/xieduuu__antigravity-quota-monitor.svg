<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ringGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="36" y1="36" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="26" fill="#131722" stroke="#2D3548" stroke-width="3"/>
  <!-- Outer quota ring track -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#232A3B" stroke-width="8"/>
  <!-- Outer quota ring progress -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#ringGrad)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="178 48" transform="rotate(-90 64 64)"/>
  <!-- Inner context arc -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#1E2534" stroke-width="6"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="url(#innerGrad)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="92 46" transform="rotate(-90 64 64)"/>
  <!-- Center pulse dot -->
  <circle cx="64" cy="64" r="6" fill="#E2E8F0"/>
</svg>