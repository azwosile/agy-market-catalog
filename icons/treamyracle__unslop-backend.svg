<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">unslop-backend mark</title>
  <desc id="logo-desc">Flat geometric Query-Collapse mark: redundant multi-query scan bars reduced into a single verified query bar.</desc>

  <!-- Solid carbon square with subtle hairline edge for dark-mode separation -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#141619" stroke="#30363D" stroke-width="4"/>

  <!-- Three staggered N+1 / full-scan bars -->
  <rect x="52" y="64" width="76" height="18" rx="4" fill="#F6F5F0"/>
  <rect x="52" y="96" width="112" height="18" rx="4" fill="#F6F5F0"/>
  <rect x="52" y="128" width="88" height="18" rx="4" fill="#F6F5F0"/>

  <!-- Collapse chevron -->
  <path d="M180 78 L204 105 L180 132" fill="none" stroke="#9CA3AF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single verified indexed query bar -->
  <rect x="52" y="168" width="152" height="24" rx="5" fill="#34D399"/>
</svg>