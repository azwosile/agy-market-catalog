<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- High-contrast rounded badge with ~10% outer transparent margin -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#18181B" stroke="#52525B" stroke-width="2" />

  <!-- Subtle vertical timeline spine linking tool & commentary rows -->
  <line x1="34" y1="36" x2="34" y2="92" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />

  <!-- Row 1: Cyan terminal chevron (>_) + muted tool execution pill -->
  <path d="M29 33L35 37L29 41" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="38" y1="41" x2="44" y2="41" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" />
  <rect x="50" y="33" width="46" height="8" rx="4" fill="#27272A" stroke="#3F3F46" stroke-width="1" />
  <rect x="54" y="36" width="22" height="2" rx="1" fill="#A1A1AA" />

  <!-- Row 2: Interleaved visible commentary lines -->
  <circle cx="34" cy="56" r="3.5" fill="#F4F4F5" />
  <rect x="44" y="53" width="54" height="5" rx="2.5" fill="#F4F4F5" />
  <rect x="44" y="63" width="40" height="5" rx="2.5" fill="#D4D4D8" />

  <!-- Row 3: Second compact tool pill + emerald verified status dot -->
  <rect x="30" y="79" width="8" height="8" rx="2" fill="#27272A" stroke="#22D3EE" stroke-width="1.5" />
  <rect x="44" y="79" width="38" height="8" rx="4" fill="#27272A" stroke="#3F3F46" stroke-width="1" />
  <rect x="48" y="82" width="18" height="2" rx="1" fill="#A1A1AA" />
  <circle cx="92" cy="83" r="4.5" fill="#34D399" />

  <!-- Row 4: Final verified outcome bar -->
  <circle cx="34" cy="95" r="2.5" fill="#34D399" />
  <rect x="44" y="93" width="30" height="4" rx="2" fill="#71717A" />
</svg>