<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Shield emblem -->
  <g filter="url(#glow)">
    <path d="M64 24 L88 34 C88 56 78 78 64 88 C50 78 40 56 40 34 Z"
          fill="url(#shieldGrad)"
          stroke="#e0f2fe"
          stroke-width="1.5"
          stroke-linejoin="round"/>
  </g>

  <!-- Inner lock emblem -->
  <!-- Shackle -->
  <path d="M57 52 V46 C57 42.13 60.13 39 64 39 C67.87 39 71 42.13 71 46 V52"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="52" y="52" width="24" height="18" rx="3" fill="#ffffff"/>
  <!-- Keyhole -->
  <circle cx="64" cy="59" r="2.2" fill="#0f172a"/>
  <path d="M63 60 L62.5 65 H65.5 L65 60 Z" fill="#0f172a"/>
</svg>