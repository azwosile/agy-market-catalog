<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBC355"/>
      <stop offset="100%" stop-color="#F2A936"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECECF5"/>
      <stop offset="55%" stop-color="#CFCFE0"/>
      <stop offset="100%" stop-color="#AEAEC4"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6B6E"/>
      <stop offset="50%" stop-color="#764860"/>
      <stop offset="100%" stop-color="#6A335C"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#7A4400" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Golden-amber rounded squircle background with transparent exterior -->
  <rect x="8" y="8" width="112" height="112" rx="30" ry="30" fill="url(#bg)"/>
  <!-- Diagonal forge hammer -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M51 64 L85 98 C88.5 101.5 94 101.5 97.5 98 C101 94.5 101 89 97.5 85.5 L63.5 51.5 Z" fill="url(#handle)"/>
    <!-- Handle highlight -->
    <path d="M54.5 60.5 L88 94" stroke="#B7949B" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <!-- Hammer collar / neck -->
    <rect x="44" y="47" width="22" height="14" rx="3" transform="rotate(-45 55 54)" fill="#D8D8E8"/>
    <!-- Hammer main head + claw -->
    <path d="M35 57 L57 35 C60 32 64.5 31.5 68 33.5 L71 35.5 C67 38.5 64 41.5 62 46 L64 48 L48 64 L44 60 L41 63 L33 55 Z" fill="url(#head)"/>
    <!-- Hammer striking face -->
    <rect x="29.5" y="55.5" width="18" height="8" rx="2.5" transform="rotate(45 38.5 59.5)" fill="#C2C2D6"/>
  </g>
</svg>