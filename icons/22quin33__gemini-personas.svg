<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hydroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="64" height="128"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="64" y="0" width="64" height="128"/>
    </clipPath>
  </defs>

  <!-- Outer soft twin aura (10%+ margin preserved) -->
  <circle cx="58" cy="66" r="44" fill="#818cf8" opacity="0.18"/>
  <circle cx="70" cy="66" r="44" fill="#38bdf8" opacity="0.18"/>

  <!-- Left Half: Hydrogen / 小幽 (Nebula Catgirl) -->
  <g clip-path="url(#leftHalf)">
    <path d="M29 58 L22 22 L52 40 Z" fill="url(#hydroGrad)" stroke="#e0e7ff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 52 L27 30 L46 41 Z" fill="#f472b6" opacity="0.85"/>
    <ellipse cx="64" cy="68" rx="38" ry="34" fill="url(#hydroGrad)" stroke="#e0e7ff" stroke-width="2.5"/>
    <ellipse cx="47" cy="69" rx="5.5" ry="6.5" fill="#1e1b4b"/>
    <circle cx="45.2" cy="66.8" r="2.2" fill="#ffffff"/>
    <circle cx="49" cy="71.5" r="1.2" fill="#f0abfc"/>
    <ellipse cx="37" cy="77" rx="4.8" ry="2.6" fill="#f472b6" opacity="0.65"/>
    <path d="M55 80 Q59.5 85 64 80" fill="none" stroke="#fdf4ff" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Right Half: Carbon / 小凛 (Obsidian Crystal Gemini-tan) -->
  <g clip-path="url(#rightHalf)">
    <!-- Hexagonal crystal ribbon/crown on right -->
    <polygon points="80,36 96,21 107,33 99,54" fill="url(#carbonGrad)" stroke="#bae6fd" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="85,37 95,27 101,34 96,47" fill="#7dd3fc" opacity="0.45"/>
    <ellipse cx="64" cy="68" rx="38" ry="34" fill="url(#carbonGrad)" stroke="#bae6fd" stroke-width="2.5"/>
    <!-- Calm cool eye with diamond glint -->
    <path d="M74 66 Q81 63 87 67" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="81" cy="70" rx="5.2" ry="5.5" fill="#0f172a"/>
    <path d="M81 66.2 L82.6 69.5 L86 70.5 L82.6 71.5 L81 74.8 L79.4 71.5 L76 70.5 L79.4 69.5 Z" fill="#7dd3fc"/>
    <path d="M64 80.5 L72 79.5" fill="none" stroke="#e0f2fe" stroke-width="2.3" stroke-linecap="round"/>
  </g>

  <!-- Center Dividing Seam & Shared Gemini 4-Point Star Emblem -->
  <line x1="64" y1="31" x2="64" y2="104" stroke="#f8fafc" stroke-width="1.6" stroke-dasharray="3 2" opacity="0.8"/>
  <path d="M64 38 Q66.5 49 77 51.5 Q66.5 54 64 65 Q61.5 54 51 51.5 Q61.5 49 64 38 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Floating accents -->
  <circle cx="21" cy="84" r="2.3" fill="#e879f9"/>
  <polygon points="108,80 112,84 108,88 104,84" fill="#7dd3fc"/>
</svg>