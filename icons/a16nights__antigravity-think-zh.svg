<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="strokeHighlight" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- 10% safe outer margin: badge sits inside 13..115 -->
  <rect x="13" y="13" width="102" height="102" rx="26" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="100" height="100" rx="25" stroke="url(#strokeHighlight)" stroke-width="2" />

  <!-- Stylized geometric "思" upper grid ("田") -->
  <rect x="38" y="29" width="52" height="33" rx="6.5" stroke="#FFFFFF" stroke-width="5.5" stroke-linejoin="round" />
  <line x1="64" y1="30" x2="64" y2="61" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="39" y1="45.5" x2="89" y2="45.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- Lower "心" transformed into dual-channel signal wave + dot accents -->
  <path d="M35 81 C39 76, 43 74, 46 80" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <path d="M51 74 C51 87, 57 93, 72 93 L80 93" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="66" cy="75.5" r="3.8" fill="#E0F2FE" />
  <circle cx="88.5" cy="79" r="3.8" fill="#FFFFFF" />

  <!-- Subtle outer dual-track indicator arc -->
  <path d="M40 102 H88" stroke="#CFFAFE" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85" />
</svg>