<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="orbitCW" d="M 48,0 A 48,18.5 0 1,1 -48,0 A 48,18.5 0 1,1 48,0"/>
    <path id="orbitCCW" d="M -48,0 A 48,18.5 0 1,0 48,0 A 48,18.5 0 1,0 -48,0"/>
  </defs>

  <!-- Deep Obsidian & Indigo Radial Squircle Backdrop -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1.5"/>

  <!-- Breathing Singularity Core Aura -->
  <circle cx="64" cy="64" r="44" fill="url(#coreAura)">
    <animate attributeName="r" values="38;48;38" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Tilted Orbital Synapse Ring 1 (+30 deg) with Blue & Red Knowledge Photons -->
  <g transform="translate(64,64)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="25;35;25" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="48" ry="18.5" fill="none" stroke="#4285F4" stroke-opacity="0.44" stroke-width="1.75"/>
      <ellipse cx="0" cy="0" rx="48" ry="18.5" fill="none" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="6 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <g filter="url(#glow)">
        <circle r="5.2" fill="#4285F4" fill-opacity="0.35"/>
        <circle r="3.4" fill="#4285F4" stroke="#FFFFFF" stroke-width="0.9"/>
        <animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#orbitCW"/></animateMotion>
      </g>
      <g filter="url(#glow)">
        <circle r="5.2" fill="#EA4335" fill-opacity="0.35"/>
        <circle r="3.4" fill="#EA4335" stroke="#FFFFFF" stroke-width="0.9"/>
        <animateMotion dur="5.2s" begin="-2.6s" repeatCount="indefinite"><mpath href="#orbitCW"/></animateMotion>
      </g>
    </g>
  </g>

  <!-- Tilted Orbital Synapse Ring 2 (-30 deg) with Amber & Green Knowledge Photons -->
  <g transform="translate(64,64)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-25;-35;-25" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="48" ry="18.5" fill="none" stroke="#34A853" stroke-opacity="0.44" stroke-width="1.75"/>
      <ellipse cx="0" cy="0" rx="48" ry="18.5" fill="none" stroke="#86EFAC" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="6 14">
        <animate attributeName="stroke-dashoffset" from="0" to="40" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <g filter="url(#glow)">
        <circle r="5.2" fill="#FBBC04" fill-opacity="0.35"/>
        <circle r="3.4" fill="#FBBC04" stroke="#FFFFFF" stroke-width="0.9"/>
        <animateMotion dur="5.2s" begin="-1.3s" repeatCount="indefinite"><mpath href="#orbitCCW"/></animateMotion>
      </g>
      <g filter="url(#glow)">
        <circle r="5.2" fill="#34A853" fill-opacity="0.35"/>
        <circle r="3.4" fill="#34A853" stroke="#FFFFFF" stroke-width="0.9"/>
        <animateMotion dur="5.2s" begin="-3.9s" repeatCount="indefinite"><mpath href="#orbitCCW"/></animateMotion>
      </g>
    </g>
  </g>

