<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MiniCI Brand Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded App Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="10"/>

  <!-- Subtle Inner Terminal Grid Accent -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.65"/>

  <!-- Left CI Pipeline DAG Nodes & Vertical Bus -->
  <line x1="128" y1="156" x2="128" y2="356" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <circle cx="128" cy="156" r="20" fill="#10B981"/>
  <circle cx="128" cy="256" r="20" fill="#38BDF8"/>
  <circle cx="128" cy="356" r="20" fill="#10B981"/>

  <!-- 3 Matrix / Cost Optimization Bars (Shrinking Spend Profile) -->
  <rect x="174" y="138" width="212" height="36" rx="18" fill="#1E293B"/>
  <rect x="174" y="138" width="154" height="36" rx="18" fill="url(#barSky)"/>

  <rect x="174" y="238" width="212" height="36" rx="18" fill="#1E293B"/>
  <rect x="174" y="238" width="116" height="36" rx="18" fill="url(#barEmerald)"/>

  <rect x="174" y="338" width="118" height="36" rx="18" fill="url(#barEmerald)"/>

  <!-- Crisp FinOps Dollar / Delta Badge (Bottom-Right) -->
  <circle cx="358" cy="356" r="56" fill="#06281E" stroke="#10B981" stroke-width="8"/>
  <line x1="358" y1="318" x2="358" y2="394" stroke="#34D399" stroke-width="9" stroke-linecap="round"/>
  <path d="M 376 336 C 376 325, 340 325, 340 340 C 340 353, 378 353, 378 369 C 378 385, 340 385, 340 373" fill="none" stroke="#ECFDF5" stroke-width="10" stroke-linecap="round"/>
</svg>